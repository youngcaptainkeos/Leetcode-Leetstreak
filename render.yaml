services:
  - type: web
    name: leetstreak-api
    env: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leetstreak-db
          property: connectionString
      - key: POLL_INTERVAL_MINUTES
        value: 15
      - key: CORS_ORIGINS
        value: "*"
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        sync: false

databases:
  - name: leetstreak-db
    databaseName: leetstreak
    user: leetstreak
    plan: free
