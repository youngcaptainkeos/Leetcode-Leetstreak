services:
  - type: web
    name: codestreak-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codestreak-db
          property: connectionString
      - key: POLL_INTERVAL_MINUTES
        value: 15
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: codestreak-db
    databaseName: codestreak
    user: codestreak
    plan: free
