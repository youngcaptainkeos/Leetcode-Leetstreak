services:
  - type: web
    name: leetstreak-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leetstreak-db
          property: connectionString
      - key: POLL_INTERVAL_MINUTES
        value: 15
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: leetstreak-db
    databaseName: leetstreak
    user: leetstreak
    plan: free
