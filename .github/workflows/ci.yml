name: Continuous Integration

on:
  push:
    branches:
      - main
      - pre-launch
  pull_request:
    branches:
      - main
      - pre-launch

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend Tests & PostgreSQL Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leetstreak_test_ci
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt

      - name: Run Backend Unit Tests (SQLite & Synthetic Fixtures)
        env:
          PYTHONPATH: backend:backend/tests
          JWT_SECRET: "test-secret-value-for-ci-and-testing-only-12345"
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Run Native PostgreSQL Migration & Advisory Lock Tests
        env:
          PYTHONPATH: backend:backend/tests
          JWT_SECRET: "test-secret-value-for-ci-and-testing-only-12345"
          LEETSTREAK_TEST_POSTGRES_URL: "postgresql+psycopg2://testuser:testpassword@127.0.0.1:5432/leetstreak_test_ci"
        run: |
          python -m unittest backend/tests/test_postgres_migrations.py

  frontend-checks:
    name: Frontend Types, Tests, Builds & Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node Dependencies
        run: |
          npm --prefix web ci
          npm --prefix extension ci

      - name: TypeScript Check (Website)
        run: |
          npm --prefix web run check

      - name: Run Client Unit Tests
        run: |
          node --test extension/tests/*.test.mjs

      - name: Build Website Bundle
        run: |
          npm --prefix web run build

      - name: Package Extension & Mirror Archives
        run: |
          python3 scripts/sync_release.py --package

      - name: Verify Release Consistency & Checksums
        run: |
          python3 scripts/sync_release.py --verify

  hygiene-checks:
    name: Secret & Artifact Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hygiene Scan
        run: |
          python3 scripts/check_hygiene.py
