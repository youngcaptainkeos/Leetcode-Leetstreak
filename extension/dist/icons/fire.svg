<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 28 28" fill="none" style="overflow: visible;">
  <style>
    @keyframes flame-outer-anim {
      0%, 100% { transform: scale(1) translateY(0); opacity: 0.95; }
      50% { transform: scale(1.08) translateY(-0.8px); opacity: 1; }
    }
    @keyframes flame-inner-anim {
      0%, 100% { transform: scale(0.92) translateY(0); }
      50% { transform: scale(1.12) translateY(-1.2px); }
    }
    .flame-outer { animation: flame-outer-anim 1.2s ease-in-out infinite; transform-origin: bottom center; }
    .flame-inner { animation: flame-inner-anim 0.7s ease-in-out infinite; transform-origin: bottom center; }
  </style>

  <path class="flame-outer" d="M12 2C10.5 4.5 9 7 9 10C9 14.5 12 16 12 21C12 21 18 18.5 18 13C18 7.5 14.5 4 12 2Z" fill="url(#flameGradOuter)" />
  <path class="flame-inner" d="M12 9C11 10.5 10.5 12 10.5 13.5C10.5 16 12 17 12 20C12 20 15 18 15 15C15 11.5 13 10 12 9Z" fill="url(#flameGradInner)" />

  <defs>
    <linearGradient id="flameGradOuter" x1="12" y1="2" x2="12" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="50%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFC400"/>
    </linearGradient>
    <linearGradient id="flameGradInner" x1="12" y1="9" x2="12" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
  </defs>
</svg>
