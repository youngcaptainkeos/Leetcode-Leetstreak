<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetStreak Solve Alert</title>
  <style>
    :root {
      --background: #111318;
      --surface-high: #252934;
      --border: #363B47;
      --text-primary: #F1F5F9;
      --text-secondary: #9CA3AF;
      --primary: #A78BFA;
      --primary-container: #3B2D63;
      --streak: #FB923C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background-color: var(--background);
      color: var(--text-primary);
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
    }
    .card {
      background-color: var(--surface-high);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--streak);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
    }
    .message {
      font-size: 13px;
      line-height: 1.4;
      color: var(--text-primary);
    }
    .message strong { color: #ffffff; }
    .message .prob { color: var(--primary); font-weight: 600; }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .action-btn {
      background-color: var(--primary);
      color: #1E1B4B;
      border: none;
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .action-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">
        <span>🔥</span>
        <span>LeetStreak Solve Alert</span>
      </div>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    <div class="message" id="msgText">
      Loading solve alert…
    </div>
    <div class="actions">
      <a href="#" id="openLink" target="_blank" class="action-btn">
        Open Problem ↗
      </a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const user = params.get('user') || 'A friend';
    const title = params.get('title') || 'a question';
    const url = params.get('url') || 'https://leetcode.com';

    document.getElementById('msgText').innerHTML = `<strong>${user}</strong> just solved <span class="prob">"${title}"</span> on LeetCode!`;
    const openLink = document.getElementById('openLink');
    openLink.href = url;

    openLink.addEventListener('click', () => {
      setTimeout(() => window.close(), 300);
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.close();
    });

    // Auto close window after 10 seconds
    setTimeout(() => {
      window.close();
    }, 10000);
  </script>
</body>
</html>
