services:
  db:
    image: postgres:16-alpine
    container_name: codestreak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: codestreak
      POSTGRES_PASSWORD: codestreak
      POSTGRES_DB: codestreak
    ports:
      - "5433:5432"
    volumes:
      - codestreak_pgdata:/var/lib/postgresql/data

volumes:
  codestreak_pgdata:
